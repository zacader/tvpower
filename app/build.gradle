plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvpower.app'
    compileSdk 33

    defaultConfig {
        applicationId 'com.tvpower.app'
        minSdk 29
        targetSdk 33
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
        }
        release {
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
